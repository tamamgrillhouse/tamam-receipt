<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Παραγγελία · TAMAM Grill House</title>
<style>
  :root{
    --bg:#0d0f14; --card:#ffffff; --ink:#1a1a1a; --muted:#777;
    --line:#e2e2e2; --accent:#f5c842; --green:#2faa5e; --red:#d4453f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:linear-gradient(160deg,#0b0d12,#141a2e);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--ink); min-height:100vh; min-height:100dvh;
    padding:18px 12px 40px; display:flex; flex-direction:column; align-items:center;
  }
  .sheet{
    width:100%; max-width:420px; background:var(--card); border-radius:16px;
    box-shadow:0 18px 50px rgba(0,0,0,.5); overflow:hidden;
  }

  /* Header */
  .rv-head{
    background:linear-gradient(135deg,#1c2554,#13183a); color:#fff;
    padding:22px 20px 18px; text-align:center; position:relative;
  }
  .rv-logo{
    font-weight:800; font-size:24px; letter-spacing:2px;
    color:var(--accent); line-height:1;
  }
  .rv-logo span{color:#fff;}
  .rv-sub{font-size:11px; color:#9aa3c4; margin-top:4px; letter-spacing:1px; text-transform:uppercase;}
  .rv-store{font-size:11.5px; color:#c3cbe6; margin-top:8px; line-height:1.5;}

  /* Order badge */
  .rv-ordbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 20px; background:#f7f8fa; border-bottom:1px solid var(--line);
  }
  .rv-ordnum{font-weight:800; font-size:18px;}
  .rv-ordnum .pfx{font-size:13px; color:var(--muted); font-weight:600;}
  .rv-type{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
    padding:5px 11px; border-radius:50px; color:#fff;
  }
  .rv-type.delivery{background:#4a9ef0;}
  .rv-type.takeaway{background:#38d97a;}
  .rv-type.table{background:#e0a020;}
  .rv-meta{font-size:11.5px; color:var(--muted); padding:8px 20px 0; text-align:right;}

  /* Customer */
  .rv-cust{
    padding:12px 20px; background:#fffdf4; border-bottom:1px dashed var(--line);
    font-size:13px; line-height:1.7;
  }
  .rv-cust .row{display:flex; gap:8px;}
  .rv-cust .ico{flex-shrink:0; width:18px; text-align:center;}
  .rv-cust .ph{font-weight:800; font-size:15px;}

  /* Items */
  .rv-items{padding:14px 20px;}
  .rv-item{padding:9px 0; border-bottom:1px solid #f0f0f0;}
  .rv-item:last-child{border-bottom:none;}
  .rv-item-top{display:flex; justify-content:space-between; gap:10px; align-items:baseline;}
  .rv-item-name{font-size:14px; font-weight:600;}
  .rv-item-name .q{color:var(--accent-ink,#c79400); font-weight:800; margin-right:2px;}
  .rv-item-price{font-size:14px; font-weight:700; white-space:nowrap;}
  .rv-item-detail{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.5; white-space:pre-line;}

  /* Totals */
  .rv-totals{padding:14px 20px; background:#f7f8fa; border-top:2px dashed var(--line);}
  .rv-trow{display:flex; justify-content:space-between; font-size:13px; padding:3px 0; color:#444;}
  .rv-trow.disc{color:var(--green);}
  .rv-trow.final{
    font-size:19px; font-weight:800; color:var(--ink);
    border-top:1px solid var(--line); margin-top:6px; padding-top:9px;
  }
  .rv-pay{
    margin-top:10px; text-align:center; font-size:13px; font-weight:700;
    padding:8px; border-radius:8px; background:#fff; border:1px solid var(--line);
  }

  /* Footer */
  .rv-foot{padding:16px 20px 20px; text-align:center; color:var(--muted); font-size:11px; line-height:1.6;}
  .rv-foot b{color:#555;}

  /* Error */
  .rv-error{
    max-width:420px; background:#fff; border-radius:16px; padding:36px 26px;
    text-align:center; box-shadow:0 18px 50px rgba(0,0,0,.5);
  }
  .rv-error .em{font-size:42px; margin-bottom:12px;}
  .rv-error h2{font-size:18px; margin-bottom:8px;}
  .rv-error p{font-size:13px; color:var(--muted); line-height:1.6;}

  .rv-credit{margin-top:18px; font-size:10.5px; color:#5a6488; letter-spacing:.5px;}

  /* Full-screen σε κινητά — η απόδειξη γεμίζει όλη την οθόνη */
  @media (max-width:480px){
    body{padding:0;}
    .sheet{
      max-width:none; width:100%; flex:1;
      border-radius:0; box-shadow:none;
      display:flex; flex-direction:column;
    }
    .rv-items{flex:1;}            /* σπρώχνει σύνολα + footer στο κάτω μέρος */
    .rv-credit{margin:10px 0; color:#7a85b0;}
  }
</style>
</head>
<body>
<div id="rv-root"></div>
<div class="rv-credit">TAMAM Grill House · Ψηφιακό αντίγραφο παραγγελίας</div>

/* ── Helpers ──────────────────────────────────────────────────────────────── */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(n){return (Math.round((+n||0)*100)/100).toFixed(2).replace('.',',')+' €';}

function typeClass(ty){
  const t=(ty||'').toLowerCase();
  if(t.indexOf('deliv')>=0) return 'delivery';
  if(t.indexOf('away')>=0 || t.indexOf('take')>=0) return 'takeaway';
  return 'table';
}

/* ╔══════════════════════════════════════════════════════════════════════════╗
   ║  ΛΕΞΙΚΟ QR — ΑΝΤΙΓΡΑΦΟ ΤΟΥ src/printing/receipt-dict.js (POS)            ║
   ╚══════════════════════════════════════════════════════════════════════════╝
   Το QR στέλνει **κωδικούς αντί για λέξεις** ώστε να σκανάρεται σε 58mm χαρτί
   (μετρημένο 27-08-2026: 8 γραμμές δεν τύπωναν ΚΑΝΕΝΑ QR → 65×65 άνετα).
   Εδώ ξαναγίνονται κανονικά ελληνικά.

   ⚠️ ΑΥΤΟΥΣΙΟ ΑΝΤΙΓΡΑΦΟ — ❌ ΠΟΤΕ μονόπλευρη αλλαγή. Ο φρουρός
   `npm run test:receipt-dict` (§6) συγκρίνει τους δύο πίνακες όρο-όρο.
   ⚠️ Ο πίνακας είναι **έκδοση 1** (`dv:1`). Νέα έκδοση → ΚΡΑΤΑ και την παλιά
   εδώ: αποδείξεις σε τσέπες πελατών πρέπει να ανοίγουν για πάντα. */
var RECEIPT_DICT_V1 = [
  // ── ετικέτες Απ'Όλα (0-2) ──
  "Απ'Όλα Ταμάμ", "Απ'Όλα Κ", "Απ'Όλα Ν",
  // ── σάλτσες (3-13) ──
  'Σως Γιαούρτι', "Σως Caesar's", 'Σως Μουστάρδας', 'Σως Ταμάμ', 'Σως BBQ', 'Σως Vegan',
  'Μελιτζανοσαλάτα', 'Τυροκαυτερή', 'Ουγγαρέζα', 'Μαγιονέζα', 'Τζατζίκι',
  // ── υλικά (14-24) ──
  'Λάχανο-Καρότο', 'Λάχανο & καρότο', 'Πράσινη Σαλάτα', 'Αγγουροντομάτα',
  'Μουστάρδα', 'Καλαμπόκι', 'Παρμεζάνα', 'Κρεμμύδι', 'Παξιμάδι', 'Μπέικον', 'Κασέρι',
  // ── κοινά σε υλικά ΚΑΙ ονόματα (25-27) ──
  'Πατάτες', 'Ντομάτα', 'Κέτσαπ',
  // ── όροι ανάλυσης (28-38) ──
  // ⚠️ το «½ Μερίδα» ΔΕΝ μπορεί να μπει: το «½» (U+00BD) πέφτει ΜΕΣΑ στην περιοχή
  //    των κωδικών → η διαφυγή του το σπάει και η αποκωδικοποίηση δεν επιστρέφει
  //    το αρχικό (το έπιασε ο φρουρός §1 στην πρώτη εκτέλεση). Το «Μερίδα» καλύπτει το μεγαλύτερο μέρος.
  'Διπλό Κρέας', 'Διπλή Πίτα', 'Μεγάλη', 'Ολόκληρη', 'Μεγάλο Dip', 'Μικρό Dip',
  '→ ΜΟΝΟ:', 'Υλικά: ', 'σκέτο', 'Combo', 'Extra: ',
  // ── λέξεις ονομάτων προϊόντων (39-…) ──
  'Καλαμαράκι', 'Κοτόπουλο', 'Λαχανικών', 'Λουκάνικο', 'Coca-Cola', 'Πορτοκάλι',
  'Μπιφτέκι', 'Σουβλάκι', 'Χοιρινός', 'Αραβική', 'Πανσέτα', 'Ρετσίνα', 'Σνίτσελ',
  'Φιλέτο', 'Χοιρινό', 'Μερίδα', 'Μπούτι', 'Ντόνερ', 'Amstel', 'Falafel',
  'Λαβάς', 'Γύρος', 'Πίτα', 'Σαλάτα', 'Μπύρα', 'Sprite', 'Fanta',
  'Cheeseburger', 'Sandwich', 'Burger', 'Vegan', 'Club', 'Zero', 'Άλφα',
  "Caesar's", 'τεμ.', '330ml', '500ml', '1.5lt', 'Σως ',
];

var APOLA_PARENS_V1 = {
  'Κ':     'Πατάτες, Ντομάτα, Κρεμμύδι, Κέτσαπ, Μουστάρδα',
  'Ταμάμ': 'Λάχανο-Καρότο, Ντομάτα, Πατάτες, Σως Γιαούρτι',
  'Ν':     'Πατάτες, Ντομάτα, Λάχανο-Καρότο, Σως Vegan',
};

var DICT_ESC = '\u00A0', DICT_FIRST = 0xA1, DICT_LAST = 0xFF;

/* Χαρακτήρα-χαρακτήρα — ❌ ΠΟΤΕ split/join ανά όρο (ένας όρος περιέχει άλλον). */
function dictDecode(s, dict){
  var t = String(s == null ? '' : s), out = '', i, ch, code, term;
  for(i = 0; i < t.length; i++){
    ch = t[i];
    if(ch === DICT_ESC){ out += t[++i] || ''; continue; }   // literal που είχε διαφύγει
    code = ch.charCodeAt(0);
    if(code >= DICT_FIRST && code <= DICT_LAST){
      term = dict[code - DICT_FIRST];
      out += term === undefined ? ch : term;                // άγνωστος κωδικός → αυτούσιος
      continue;
    }
    out += ch;
  }
  return out;
}

/* Κενή παρένθεση `()` = ρητό σημάδι «τα υλικά είναι παράγωγα». ❌ ΠΟΤΕ «δεν έχει
   παρένθεση, άρα βάλ' την»: η θετική προβολή «Απ'Όλα Κ → ΜΟΝΟ:» δεν έχει κι
   εκείνη, και θα γέμιζε με υλικά που ο πελάτης ρητά ΔΕΝ πήρε. */
function apolaExpand(s, parens){
  return String(s == null ? '' : s).replace(
    /(\*?Απ'Όλα (Ταμάμ|Κ|Ν)) \(\)/g,
    function(all, head, label){
      var inner = parens[label];
      return inner ? head + ' (' + inner + ')' : all;
    });
}

/* Επιστρέφει τον αποκωδικοποιητή για την έκδοση λεξικού που κουβαλά η απόδειξη.
   Απόν/άγνωστο `dv` → ταυτότητα (παλιά απόδειξη σε καθαρό κείμενο, ανέπαφη). */
function textDecoderFor(dv){
  if(dv === 1) return function(s){ return apolaExpand(dictDecode(s, RECEIPT_DICT_V1), APOLA_PARENS_V1); };
  return function(s){ return s == null ? '' : String(s); };
}

/* 🔴 ΣΧΗΜΑ v2 → ΕΣΩΤΕΡΙΚΗ ΜΟΡΦΗ.
   Το v2 (24-08-2026) πετάει τα στοιχεία καταστήματος (η σελίδα ΑΝΗΚΕΙ στο κατάστημα),
   κρατά ακέραια λεπτά και μία ημερομηνία 10 χαρακτήρων — ώστε το QR να πέσει από
   69×69 σε 61×61 τετραγωνάκια και να διαβάζεται από κάμερα κινητού.
   ⚠️ ΤΟ v1 ΠΕΡΝΑΕΙ ΑΝΕΠΑΦΟ: αποδείξεις που ήδη κυκλοφορούν σε τσέπες πελατών
   ΠΡΕΠΕΙ να συνεχίσουν να ανοίγουν. ❌ ΠΟΤΕ μη σβήσεις αυτόν τον κλάδο. */
function normalize(d){
  if(!d || d.v !== 2) return d || {};
  const TY = {1:'Delivery', 2:'Take Away'};
  const PM = {c:'cash', k:'card', m:'mixed', p:'credit'};
  const g  = String(d.d||'');
  const dec = textDecoderFor(d.dv);
  return {
    n:  d.n || '',
    ty: TY[d.t] || d.tl || '',
    dt: g.length>=6  ? g.slice(0,2)+'-'+g.slice(2,4)+'-20'+g.slice(4,6) : '',
    tm: g.length>=10 ? g.slice(6,8)+':'+g.slice(8,10) : '',
    // Το `dv` λέει ΠΟΙΟ λεξικό χρησιμοποιήθηκε· απόν = καθαρό κείμενο (παλιά απόδειξη).
    it: (d.i||[]).map(r => [dec(r[0]), r[1], (r[2]||0)/100, dec(r[3]||'')]),
    su: (d.s||0)/100, sc: (d.sc||0)/100, di: (d.di||0)/100,
    fi: (d.f||0)/100, pm: PM[d.p] || 'cash',
  };
}

/* Render όμορφης απόδειξης από το αποσυμπιεσμένο object */
function render(d){
  const st = d.st || {};
  const storeLines = [st.a, [st.p?('Τηλ: '+st.p):'', st.f?('ΑΦΜ: '+st.f):''].filter(Boolean).join(' · ')].filter(Boolean);

  // Customer block (delivery: όλα· takeaway: phone/name)
  let custHtml = '';
  if(d.c){
    const c=d.c, rows=[];
    if(c.p)  rows.push(`<div class="row"><span class="ico">📞</span><span class="ph">${esc(c.p)}</span></div>`);
    if(c.n)  rows.push(`<div class="row"><span class="ico">👤</span><span>${esc(c.n)}</span></div>`);
    if(c.a)  rows.push(`<div class="row"><span class="ico">📍</span><span>${esc(c.a)}</span></div>`);
    if(c.f||c.b) rows.push(`<div class="row"><span class="ico">🏢</span><span>${esc(c.f||'')}${c.b?(' · Κουδ: '+esc(c.b)):''}</span></div>`);
    if(c.no) rows.push(`<div class="row"><span class="ico">📝</span><span>${esc(c.no)}</span></div>`);
    if(rows.length) custHtml = `<div class="rv-cust">${rows.join('')}</div>`;
  }

  // Items
  const items = (d.it||[]).map(it=>{
    const name=it[0], qty=it[1], price=it[2], detail=it[3];
    return `<div class="rv-item">
      <div class="rv-item-top">
        <span class="rv-item-name"><span class="q">${esc(qty)}×</span>${esc(name)}</span>
        <span class="rv-item-price">${fmt(price)}</span>
      </div>
      ${detail?`<div class="rv-item-detail">${esc(detail)}</div>`:''}
    </div>`;
  }).join('');

  // Totals
  let totals = '';
  if(d.sc>0) totals += `<div class="rv-trow"><span>Χρέωση περιοχής</span><span>+${fmt(d.sc)}</span></div>`;
  if(d.di>0) totals += `<div class="rv-trow disc"><span>Έκπτωση</span><span>−${fmt(d.di)}</span></div>`;
  const subShown = (d.sc>0 || d.di>0);
  const subRow = subShown ? `<div class="rv-trow"><span>Σύνολο</span><span>${fmt(d.su)}</span></div>` : '';

  const payTxt = d.pm==='card'  ? '💳 Κάρτα'
               : d.pm==='mixed' ? '🧾 Μεικτή'
               : d.pm==='credit'? '📋 Επί Πιστώσει'
               : '💵 Μετρητά';

  document.getElementById('rv-root').innerHTML = `
    <div class="sheet">
      <div class="rv-head">
        <div class="rv-logo">TAMAM<span> GRILL HOUSE</span></div>
        <div class="rv-sub">Στοιχεία παραγγελίας</div>
        ${storeLines.length?`<div class="rv-store">${storeLines.map(esc).join('<br>')}</div>`:''}
      </div>
      <div class="rv-ordbar">
        <div class="rv-ordnum">${esc(d.n||'')}</div>
        <span class="rv-type ${typeClass(d.ty)}">${esc(d.ty||'')}</span>
      </div>
      <div class="rv-meta">${esc(d.dt||'')} ${esc(d.tm||'')}</div>
      ${custHtml}
      <div class="rv-items">${items || '<div style="text-align:center;color:#999;font-size:13px;padding:10px;">—</div>'}</div>
      <div class="rv-totals">
        ${subRow}${totals}
        <div class="rv-trow final"><span>ΣΥΝΟΛΟ</span><span>${fmt(d.fi)}</span></div>
        <div class="rv-pay">${payTxt}</div>
      </div>
      <div class="rv-foot">
        <b>Ευχαριστούμε!</b><br>Μη φορολογικό παραστατικό — ψηφιακό αντίγραφο
      </div>
    </div>`;
}

function showError(msg){
  document.getElementById('rv-root').innerHTML = `
    <div class="rv-error">
      <div class="em">🧾</div>
      <h2>Δεν φορτώθηκε η παραγγελία</h2>
      <p>${esc(msg)}</p>
    </div>`;
}

/* ── Boot ─────────────────────────────────────────────────────────────────── */
(function(){
  try{
    const hash = location.hash.replace(/^#/,'').trim();
    if(!hash){ showError('Δεν υπάρχουν δεδομένα στον σύνδεσμο. Σκάναρε ξανά το QR από το απόκομμα.'); return; }
    const json = LZString.decompressFromEncodedURIComponent(hash);
    if(!json){ showError('Ο σύνδεσμος είναι αλλοιωμένος ή ελλιπής.'); return; }
    const data = normalize(JSON.parse(json));
    render(data);
    document.title = (data.n?('#'+data.n+' · '):'') + 'Παραγγελία · TAMAM';
  }catch(e){
    showError('Σφάλμα ανάγνωσης δεδομένων.');
  }
})();
</script>
</body>
</html>
